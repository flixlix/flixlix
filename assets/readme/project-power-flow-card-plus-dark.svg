<svg xmlns="http://www.w3.org/2000/svg" width="520" height="106" viewBox="0 0 520 106" fill="none"><foreignObject width="100%" height="100%"><style>
  @font-face { font-family: Satoshi; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 300 900; }
  * { box-sizing: border-box; margin: 0; }
  .root { font-family: Satoshi, ui-sans-serif, system-ui, sans-serif; color: #d1d5dc; font-size: 16px; line-height: 24px; padding: 4px 2px; -webkit-font-smoothing: antialiased; }
  .root.inline { display: inline-block; padding: 2px; }
  .id { display: flex; align-items: center; gap: 16px; margin-bottom: 44px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; }
  .name { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.5px; color: #ffffff; }
  .role { font-size: 12.8px; line-height: 19px; color: #d1d5dc; }
  h2 { font-size: 18px; line-height: 28px; font-weight: 600; letter-spacing: -0.45px; color: #ffffff; margin: 0 0 22px; }
  h2.flush { margin: 0; }
  p { margin: 0 0 16px; }
  p:last-child { margin-bottom: 0; }
  .u { text-decoration: underline dashed #ff902e; text-decoration-thickness: 1px; text-underline-offset: 5px; }
  .strong { color: #ffffff; font-weight: 500; }
  .project { display: flex; align-items: flex-start; gap: 24px; padding: 2px 0; }
  .ptext { flex: 1; max-width: 470px; }
  .pname { font-size: 16px; line-height: 24px; font-weight: 500; color: #d1d5dc; }
  .pdesc { font-size: 14px; line-height: 20px; color: #9f9fa9; margin-top: 4px; }
  .meta { font-size: 12px; line-height: 18px; color: #71717b; margin-top: 8px; display: flex; gap: 6px; }
  .meta .hl { color: #ff902e; }
  .meta i { font-style: normal; }
  .arrow { color: #71717b; font-size: 16px; line-height: 24px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; color: #d1d5dc; background: #18181b; border: 1px solid #27272a; border-radius: 999px; padding: 7px 14px; }
  .pill span { color: #71717b; font-size: 12px; }
</style><div class="root" xmlns="http://www.w3.org/1999/xhtml">
    <div class="project">
      <div class="ptext">
        <div class="pname">Power Flow Card Plus</div>
        <div class="pdesc">Real-time power flow between grid, solar, battery and home, right on your Home Assistant dashboard.</div>
        <div class="meta"><span class="hl">970k+ downloads</span><i>·</i><span>1.2k stars</span><i>·</i><span>Home Assistant</span></div>
